<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="36" y="34" font-size="17" font-weight="bold" fill="#111827">按需映射与跨进程流转</text>
  <text x="36" y="55" font-size="12" fill="#6b7280">VA 启动时预留、零物理占用；物理页按需映射，空闲归还驱动，供同卡其他实例使用</text>

  <rect x="30" y="72" width="470" height="148" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="46" y="94" font-size="13" font-weight="bold" fill="#374151">实例 A（引擎进程）</text>
  <rect x="46" y="106" width="50" height="30" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="100" y="106" width="50" height="30" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="154" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="208" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="262" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="316" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="370" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="424" y="106" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="46" y="158" font-size="10" fill="#6b7280">VA 空间（进程私有）</text>
  <rect x="300" y="162" width="120" height="28" fill="#fef3c7" stroke="#d97706"/>
  <text x="314" y="180" font-size="11" fill="#92400e">zero page x1</text>
  <path d="M290,136 C295,145 300,153 306,162" fill="none" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="46" y="184" font-size="10" fill="#6b7280">未映射 VA 全部指向同一 zero page（COW）</text>
  <text x="46" y="206" font-size="11" fill="#92400e">启动物理占用约 1 页（2MB）</text>

  <rect x="30" y="240" width="470" height="148" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="46" y="262" font-size="13" font-weight="bold" fill="#374151">实例 B（引擎进程）</text>
  <rect x="46" y="274" width="50" height="30" fill="#d1fae5" stroke="#059669"/>
  <rect x="100" y="274" width="50" height="30" fill="#d1fae5" stroke="#059669"/>
  <rect x="154" y="274" width="50" height="30" fill="#d1fae5" stroke="#059669"/>
  <rect x="208" y="274" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="262" y="274" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="316" y="274" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="370" y="274" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="424" y="274" width="50" height="30" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="46" y="326" font-size="10" fill="#6b7280">VA 空间（进程私有）</text>
  <text x="46" y="372" font-size="11" fill="#047857">按需映射，可拿到 A 释放的物理页</text>

  <text x="560" y="94" font-size="13" font-weight="bold" fill="#374151">GPU 物理显存</text>
  <text x="560" y="112" font-size="10" fill="#6b7280">驱动仲裁：先 cuMemCreate 先得</text>
  <rect x="560" y="130" width="96" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <text x="572" y="152" font-size="11" fill="#1e40af">A 占用</text>
  <rect x="656" y="130" width="140" height="36" fill="#d1fae5" stroke="#059669"/>
  <text x="668" y="152" font-size="11" fill="#047857">B 占用</text>
  <rect x="796" y="130" width="124" height="36" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="830" y="152" font-size="11" fill="#6b7280">空闲</text>

  <path d="M474,121 C515,121 525,148 556,148" fill="none" stroke="#2563eb" marker-end="url(#arrB)"/>
  <path d="M474,289 C540,289 600,190 652,168" fill="none" stroke="#059669" marker-end="url(#arrG)"/>
  <path d="M600,168 C630,205 830,205 856,170" fill="none" stroke="#6b7280" stroke-dasharray="5 3" marker-end="url(#arrGr)"/>
  <text x="614" y="216" font-size="10" fill="#6b7280">A 空闲：unmap + release，物理页回到空闲池</text>
  <text x="560" y="246" font-size="10" fill="#6b7280">映射前自查 cudaMemGetInfo（默认留 5% headroom）</text>
  <text x="560" y="264" font-size="10" fill="#6b7280">实例退出：VA 与物理页随进程回收</text>

  <rect x="36" y="404" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="415" font-size="11" fill="#374151">A 已映射</text>
  <rect x="130" y="404" width="14" height="14" fill="#d1fae5" stroke="#059669"/>
  <text x="150" y="415" font-size="11" fill="#374151">B 已映射</text>
  <rect x="224" y="404" width="14" height="14" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="3 2"/>
  <text x="244" y="415" font-size="11" fill="#374151">未映射 VA</text>
  <rect x="330" y="404" width="14" height="14" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="350" y="415" font-size="11" fill="#374151">空闲物理页</text>
  <rect x="440" y="404" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="460" y="415" font-size="11" fill="#374151">zero page</text>

  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="arrGr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker>
  </defs>
</svg>
