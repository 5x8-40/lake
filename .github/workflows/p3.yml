name: p3

# 路径与 .gitlab-ci.yml 的 code_paths 对齐：纯文档改动不跑 P3。
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "go/**"
      - "python/**"
      - "proto/**"
      - "scripts/**"
      - "deploy/**"
      - "bench/**"
      - ".github/workflows/p3.yml"
  pull_request:
    paths:
      - "rust/**"
      - "go/**"
      - "python/**"
      - "proto/**"
      - "scripts/**"
      - "deploy/**"
      - "bench/**"
      - ".github/workflows/p3.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tonic-build(build.rs) 调 protoc 在线生成 stub,CI 需装 protoc。
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 对齐根目录 pyproject.toml 与生成 stub 校验；Qwen3 config 来自 transformers。
      - name: Python runtime deps
        run: pip install "grpcio>=1.82.1" "protobuf>=7.35.0" "transformers"
      - name: verify-p3
        run: ./scripts/verify-p3.sh

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python runtime deps
        run: pip install "grpcio>=1.82.1" "protobuf>=7.35.0" "transformers"
      # 栈端口 50051-50054 落在 Linux 默认 ephemeral 范围(32768-60999)内:
      # runner 上任何外连(含 runner agent 长连接)可能恰好占用源端口 50052 等,
      # run-local.sh 的 127.0.0.1 预检看不到绑在外网卡的 socket,随后 0.0.0.0 通配 bind 即 AddrInUse。
      # 把 ephemeral 范围压到栈端口以下,根除这类偶发冲突(2026-09-03 实测命中)。
      - name: keep ephemeral ports clear of stack ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="32768 50050"
      - name: start stack
        env:
          # P3 smoke 只验证三语言骨架联通性；不安装 Torch，避免触发 Qwen3 backend。
          LAKE_MODEL_BACKEND: mock
          LAKE_SERVED_MODEL_NAME: mock-llm
        run: |
          ./deploy/run-local.sh &
          echo $! > /tmp/lake-stack.pid
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              echo "router ready"
              exit 0
            fi
            sleep 1
          done
          echo "stack failed to become ready"
          exit 1
      - name: smoke
        run: ./deploy/smoke.sh
      - name: stop stack
        if: always()
        run: |
          if [[ -f /tmp/lake-stack.pid ]]; then
            kill "$(cat /tmp/lake-stack.pid)" 2>/dev/null || true
          fi
          # 子进程可能仍占端口
          pkill -f lake-controlplane 2>/dev/null || true
          pkill -f lake-kv-pool 2>/dev/null || true
          pkill -f lake-storage-agent 2>/dev/null || true
          pkill -f 'python3 -m lake.runtime' 2>/dev/null || true
          pkill -f lake-router 2>/dev/null || true
          true
