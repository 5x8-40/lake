# 三语言空壳编译/生成验证(见 PR #17 review follow-up:加 CI 防 drift)。
# 门禁与 .gitlab-ci.yml 对齐：docs-check 每条流水线都跑；rust/go/python/stub-drift
# 仅代码路径变化时跑；cmx-sim-check 仅 tools/cmx-sim 变化时跑。
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cmx: ${{ steps.filter.outputs.cmx }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - id: filter
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "cmx=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="${BEFORE}...HEAD"
          fi
          files="$(git diff --name-only "$RANGE" || true)"
          echo "$files"
          code=false
          cmx=false
          if echo "$files" | grep -qE '^(rust|go|python|proto|scripts|deploy|bench)/|^\.github/workflows/build\.yml'; then
            code=true
          fi
          if echo "$files" | grep -qE '^tools/cmx-sim/'; then
            cmx=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "cmx=$cmx" >> "$GITHUB_OUTPUT"

  # 文档门禁:每条流水线都跑——纯文档 PR 的唯一必跑任务。
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_doc_links.py

  cmx-sim-check:
    needs: filter
    if: needs.filter.outputs.cmx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/cmx-sim/verify.js
      - run: node tools/cmx-sim/verify-measured.js

  rust:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # tonic-build(build.rs)调 protoc 在线生成 stub,CI 需装 protoc。
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # 版本钉在 rust/rust-toolchain.toml(与 3rdparty/dynamo 对齐),勿用滚动 @stable。
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --workspace
      # storage-agent 双角色 feature 各自可单独编译(默认全开;部署期只开其一)。
      - run: cargo build -p lake-storage-agent --no-default-features --features compute
      - run: cargo build -p lake-storage-agent --no-default-features --features kvnode
      # 格式 + lint 先跑;失败时免白跑 ~500 vendor 测。
      - run: cargo fmt --check
      # vendor 只读、源码不改:-D warnings 排除之,避免上游/新 lint 逼改 fork。
      # 见 rust/vendor/UPSTREAM.md「CI / clippy」。
      - run: cargo clippy --workspace --all-targets --exclude kvbm-logical --exclude dynamo-tokens -- -D warnings
      # P4.1 正确性门禁(故意每 PR 跑;嫌慢可改 label/定时,见 UPSTREAM.md)。
      # --workspace:vendor fork(dynamo-tokens/kvbm-logical)+ lake 自有 crate
      # (controlplane/tiered-store/storage-agent …)单测全门禁,防 lake 侧回归漏网。
      - run: cargo test --workspace

  go:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      # 格式 + vet 防回归。
      - run: gofmt -l . | tee /dev/stderr | (! read)  # 有输出即失败
      - run: go vet ./...
      # Go 测试入门禁(issue #70;`-race` 本地跑,CI 嫌慢可后续加独立 job)。
      - run: go test ./...

  python:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stub 顶部校验 protobuf runtime ≥ 7.35.0 / grpcio ≥ 1.82.1(见根目录 pyproject.toml)；
      # Qwen3 config 由 transformers AutoConfig 读取，轻量 import 路径不安装 torch。
      # 装运行时依赖即可,空壳阶段不 pip install -e .(PEP 668 机器会炸;
      # worker 包就在 python/ 下,PYTHONPATH 直接 import,与本地验证一致)。
      - run: pip install "grpcio>=1.82.1" "protobuf>=7.35.0" "transformers" pytest
      - run: PYTHONPATH=. python -c "from lake.pb import lake_pb2, lake_pb2_grpc, schema_pb2; import lake.kernels, lake.runtime, lake.engine; import lake.prefill, lake.decode, lake.draft; from lake.runtime.node_scheduler import NodeScheduler; from lake.engine.model_runner import ModelRunner; from lake.engine.model_executor.models import ModelRegistry; from lake.kernels import causal_attn; print('py OK')"
      # pytest 入门禁(issue #70):torch 依赖测试用 importorskip 守卫、Qwen3 模型依赖测试
      # 用 requires_qwen3/模块级 skip 守卫,CI 无 torch 无模型缓存时自动跳过。
      - run: PYTHONPATH=. python -m pytest lake/ -q
      # bench/ 成本模型钉测试入门禁(P7 校准声称回归锚,issue #74 口径声明):
      # 纯函数无 torch 依赖,在仓库根直接跑(working-directory 覆盖 job 默认的 python/)。
      - run: python -m pytest bench/ -q
        working-directory: .

  # stub drift:重生成 Go/Python stub 后 git diff --exit-code。
  # 拦「proto 改了没重生成 stub」与「工具版本漂移致生成物变」(见 PR #17 review #4)。
  # 插件版本钉到 gen_stubs.sh 头注释一致;protoc 用 apt,靠 git diff 检测输出一致性。
  stub-drift:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # protoc-gen-go v1.36.11 需 go>=1.23;go.mod 仍是 1.22,与 GitLab GOTOOLCHAIN: auto 对齐。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools==1.82.1
      - run: bash scripts/gen_stubs.sh
      - run: git diff --exit-code
